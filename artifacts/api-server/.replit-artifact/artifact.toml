kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
localPort = 5000
name = "Flask App"
paths = ["/"]

[services.development]
# "Start application" workflow already owns port 5000 in dev; just sleep so
# the artifact proxy can route to it without spawning a second gunicorn.
run = "sleep infinity"

[services.production]

[services.production.run]
args = ["bash", "-c", "cd /home/runner/workspace && pip install -r requirements.txt --quiet && exec gunicorn --bind=0.0.0.0:5000 webapp.app:app"]

[services.production.health.startup]
path = "/"
