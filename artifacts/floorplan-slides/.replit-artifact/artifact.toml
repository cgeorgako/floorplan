kind = "slides"
previewPath = "/floorplan-slides/"
title = "Γεννήτρια Κατόψεων — Παρουσίαση"
description = "Παρουσίαση στα Ελληνικά για εταίρους που παρουσιάζει τη Γεννήτρια Προτάσεων Κατόψεων Κατοικίας: τι κάνει, πώς λειτουργεί, και γιατί είναι χρήσιμη για τεχνικά γραφεία."
version = "1.0.0"
id = "artifacts/floorplan-slides"
router = "path"

[[services]]
name = "web"
paths = [ "/floorplan-slides/" ]
localPort = 18245

[services.development]
run = "pnpm --filter @workspace/floorplan-slides run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/floorplan-slides", "run", "build" ]
serve = "static"
publicDir = "artifacts/floorplan-slides/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18245"
BASE_PATH = "/floorplan-slides/"
